spring:
  application:
    name: user-profile-service
  datasource:
    url: jdbc:h2:mem:userprofiledb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8081

logging:
  level:
    com.epam.practice.userprofile: DEBUG
